inherit: ../configs/task2_smoke.yaml
model_id: outputs/tiny-qwen3
run_suffix: _tiny
data:
  feature_file: data/task2_tiny/features.npy
  feature_index: data/task2_tiny/index.json
train:
  microbatch: 4
  checkpoint_every: 4
  dev_eval_every: 6
  stages:
    - {name: caption,  updates: 4, connector_lr: 1.0e-3, lora_lr: null, mix: {caption: 1.0}}
    - {name: instruct, updates: 4, connector_lr: 1.0e-4, lora_lr: 2.0e-5,
       mix: {presence: 0.50, counting: 0.25, caption: 0.25}}
    - {name: vqa,      updates: 4, connector_lr: 5.0e-5, lora_lr: 1.0e-5,
       mix: {vqa: 0.70, presence: 0.10, counting: 0.10, caption: 0.10}}
