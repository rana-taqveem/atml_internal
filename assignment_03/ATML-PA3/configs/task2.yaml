# Task 2: SigLIP-Qwen VLM (values from the PA3 handout, Section 2)
vision_id: google/siglip-base-patch16-224
model_id: Qwen/Qwen3-0.6B
enable_thinking: false
n_visual_tokens: 196        # 14x14 patches; 49 for the optional 2x2-pooled run
caption_prompt: "Describe this image in one sentence."

data:
  raw_dir: data/task2_raw            # annotations (downloaded)
  image_dir: data/task2_images       # only the selected COCO images
  feature_file: data/task2_features/siglip_fp16.npy
  coco_annotations: http://images.cocodataset.org/annotations/annotations_trainval2014.zip
  coco_image_url: "http://images.cocodataset.org/{split}/COCO_{split}_{id:012d}.jpg"
  vqa:
    questions_train: https://cvmlp.s3.amazonaws.com/vqa/mscoco/vqa/v2_Questions_Train_mscoco.zip
    questions_val: https://cvmlp.s3.amazonaws.com/vqa/mscoco/vqa/v2_Questions_Val_mscoco.zip
    annotations_train: https://cvmlp.s3.amazonaws.com/vqa/mscoco/vqa/v2_Annotations_Train_mscoco.zip
    annotations_val: https://cvmlp.s3.amazonaws.com/vqa/mscoco/vqa/v2_Annotations_Val_mscoco.zip
    pairs_train: https://cvmlp.s3.amazonaws.com/vqa/mscoco/vqa/v2_Complementary_Pairs_Train_mscoco.zip
    pairs_val: https://cvmlp.s3.amazonaws.com/vqa/mscoco/vqa/v2_Complementary_Pairs_Val_mscoco.zip
  captions: {train_images: 6000, captions_per_image: 3, dev_images: 96}
  grounding:
    train_pool_images: 6000          # grounding pools are generated from this train2014 subset
    train_pool_pairs: {presence: 20000, counting: 20000}
    dev_pairs: {presence: 12, counting: 12}
    test_pairs: {presence: 32, counting: 32}
    count_range: [1, 4]
  vqa_pairs:
    min_agreement: 8
    train: {yes/no: 640, number: 256, other: 640}
    dev: {yes/no: 12, number: 8, other: 12}
    test: {yes/no: 36, number: 24, other: 36}

train:
  microbatch: 8
  grad_accum: 2
  weight_decay: 0.01
  clip: 1.0
  warmup_frac: 0.05
  min_lr_frac: 0.10
  gradient_checkpointing: true
  caps: {question: 80, caption: 64, answer: 16}
  checkpoint_every: 250
  dev_eval_every: 500
  lora: {r: 16, alpha: 32, dropout: 0.05, targets: [q_proj, k_proj, v_proj, o_proj]}
  stages:
    - {name: caption,  updates: 2250, connector_lr: 1.0e-3, lora_lr: null,
       mix: {caption: 1.0}}
    - {name: instruct, updates: 1500, connector_lr: 1.0e-4, lora_lr: 2.0e-5,
       mix: {presence: 0.50, counting: 0.25, caption: 0.25}}
    - {name: vqa,      updates: 750,  connector_lr: 5.0e-5, lora_lr: 1.0e-5,
       mix: {vqa: 0.70, presence: 0.10, counting: 0.10, caption: 0.10}}

eval:
  max_new_tokens: 16
  batch_size: 8
  n_boot: 4000
