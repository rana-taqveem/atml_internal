# Kaggle/Colab smoke test: 40 updates across the three stages, frequent dev evals/checkpoints.
inherit: task2.yaml
run_suffix: _smoke
train:
  checkpoint_every: 10
  dev_eval_every: 10
  stages:
    - {name: caption,  updates: 20, connector_lr: 1.0e-3, lora_lr: null, mix: {caption: 1.0}}
    - {name: instruct, updates: 10, connector_lr: 1.0e-4, lora_lr: 2.0e-5,
       mix: {presence: 0.50, counting: 0.25, caption: 0.25}}
    - {name: vqa,      updates: 10, connector_lr: 5.0e-5, lora_lr: 1.0e-5,
       mix: {vqa: 0.70, presence: 0.10, counting: 0.10, caption: 0.10}}
